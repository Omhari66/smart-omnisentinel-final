# ============================================================
# .github/workflows/ci.yml
# SmartOmniSentinel — Continuous Integration
#
# Triggers on every push and pull request to main/develop.
# Jobs run in parallel where possible:
#   lint      → ruff (style) + mypy (types)
#   test      → pytest with coverage gate (60% minimum)
#   docker    → build API + inference Docker images (no push)
#
# The docker job depends on lint + test passing first.
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Job 1: Lint & Type-check ─────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-omnisentinel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: |
          pip install --upgrade pip
          # Only install lightweight lint tools — no torch/opencv needed
          pip install ruff==0.4.9 mypy==1.10.0 \
            pydantic==2.7.3 pydantic-settings==2.3.1 \
            fastapi==0.111.0 sqlalchemy==2.0.30 \
            structlog==24.2.0

      - name: Run ruff (style + import order)
        run: ruff check .

      - name: Run mypy (type checking)
        # Non-strict — matches pyproject.toml [tool.mypy] strict=false
        run: mypy api/ core/ services/ db/ --ignore-missing-imports

  # ── Job 2: Tests with coverage ───────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-omnisentinel

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]   # Extend to ["3.11", "3.12"] later

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install everything EXCEPT torch/torchvision/opencv/ultralytics
          # These are huge (3-5 GB) and not needed for unit/integration tests.
          # Tests mock out all ML inference calls.
          pip install \
            fastapi==0.111.0 \
            uvicorn[standard]==0.30.1 \
            sqlalchemy[asyncio]==2.0.30 \
            aiosqlite \
            alembic==1.13.1 \
            pydantic==2.7.3 \
            pydantic-settings==2.3.1 \
            python-jose[cryptography]==3.3.0 \
            passlib[bcrypt]==1.7.4 \
            python-dotenv==1.0.1 \
            structlog==24.2.0 \
            aiofiles==23.2.1 \
            httpx==0.27.0 \
            redis==5.0.4 \
            aiosmtplib==3.0.1 \
            python-dateutil==2.9.0.post0 \
            pillow==10.3.0 \
            scipy==1.13.1 \
            numpy==1.26.4 \
            pytest==8.2.2 \
            pytest-asyncio==0.23.7 \
            pytest-cov==5.0.0 \
            python-multipart==0.0.9

      - name: Run tests with coverage
        env:
          APP_ENV: testing
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
          DB__URL: sqlite+aiosqlite:///:memory:
          REDIS__ENABLED: "false"
          STORAGE__EVIDENCE_ROOT: /tmp/test_evidence
          # Prevent any real ML model loading in tests
          INFERENCE__DETECTOR_MODEL: ml/checkpoints/yolov8n.pt
          INFERENCE__POSE_MODEL: ml/checkpoints/yolov8n-pose.pt
          INFERENCE__CLASSIFIER_CHECKPOINT: ml/checkpoints/temporal_v1.pt
        run: |
          pytest \
            --cov=api \
            --cov=core \
            --cov=services \
            --cov=db \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=40 \
            -v --tb=short \
            tests/unit/ tests/integration/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: smart-omnisentinel/coverage.xml
          retention-days: 14

      - name: Post coverage to PR summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.existsSync('smart-omnisentinel/coverage.xml')
              ? 'Coverage report generated ✅' : 'Coverage report missing ⚠️';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## CI Coverage\n${coverage}\nSee artifacts for full report.`
            });

  # ── Job 3: Docker build validation ──────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]   # Only build if lint + tests pass
    defaults:
      run:
        working-directory: smart-omnisentinel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: smart-omnisentinel
          file: smart-omnisentinel/deployments/docker/Dockerfile.api
          push: false
          tags: smartomnisentinel/api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Inference Worker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: smart-omnisentinel
          file: smart-omnisentinel/deployments/docker/Dockerfile.inference
          push: false
          tags: smartomnisentinel/inference:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
