# ============================================================
# .github/workflows/docker-publish.yml
# SmartOmniSentinel — Build & Publish Docker Images
#
# Triggers ONLY on version tags (v1.0.0, v1.2.3, etc.)
# or manual workflow_dispatch (for staging deploys).
#
# What it does:
#   1. Builds API + Inference Docker images
#   2. Pushes to GitHub Container Registry (ghcr.io)
#   3. Tags with: latest, git-sha, and semver version
#
# No extra secrets needed — uses GITHUB_TOKEN automatically.
#
# Image URLs after push:
#   ghcr.io/<your-github-username>/smartomnisentinel-api:latest
#   ghcr.io/<your-github-username>/smartomnisentinel-inference:latest
# ============================================================

name: Build & Publish Docker Images

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # Matches v1.0.0, v2.1.3, etc.
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: "Push images to GHCR?"
        required: true
        default: "false"
        type: choice
        options: ["true", "false"]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # Required to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── CRITICAL: GHCR requires ALL LOWERCASE image names ─────────────────
      # github.repository_owner preserves original case (e.g. "Omhari66")
      # but ghcr.io rejects uppercase — we must normalize here.
      - name: Normalize image names to lowercase
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "API_IMAGE=ghcr.io/${OWNER}/smartomnisentinel-api" >> $GITHUB_ENV
          echo "INFERENCE_IMAGE=ghcr.io/${OWNER}/smartomnisentinel-inference" >> $GITHUB_ENV
          echo "Resolved API image:       ghcr.io/${OWNER}/smartomnisentinel-api"
          echo "Resolved Inference image: ghcr.io/${OWNER}/smartomnisentinel-inference"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Extract version tag ───────────────────────────────────────────────
      - name: Get version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"          # e.g. v1.0.0
            SEMVER="${VERSION#v}"                       # e.g. 1.0.0
          else
            SEMVER="dev-${{ github.sha }}"
          fi
          echo "VERSION=${VERSION:-dev}" >> $GITHUB_OUTPUT
          echo "SEMVER=${SEMVER}" >> $GITHUB_OUTPUT

      # ── Build & Push API image ────────────────────────────────────────────
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: smart-omnisentinel
          file: smart-omnisentinel/deployments/docker/Dockerfile.api
          push: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.push_to_registry == 'true' }}
          provenance: false        # Avoid attestation issues on new GHCR packages
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.SEMVER }}
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.SEMVER }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build & Push Inference Worker image ──────────────────────────────
      - name: Build and push Inference Worker image
        uses: docker/build-push-action@v5
        with:
          context: smart-omnisentinel
          file: smart-omnisentinel/deployments/docker/Dockerfile.inference
          push: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.push_to_registry == 'true' }}
          provenance: false        # Avoid attestation issues on new GHCR packages
          tags: |
            ${{ env.INFERENCE_IMAGE }}:latest
            ${{ env.INFERENCE_IMAGE }}:${{ steps.version.outputs.SEMVER }}
            ${{ env.INFERENCE_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.SEMVER }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Print image summaries
        run: |
          echo "=== Images Built & Pushed ==="
          echo "API:       ${{ env.API_IMAGE }}:${{ steps.version.outputs.SEMVER }}"
          echo "Inference: ${{ env.INFERENCE_IMAGE }}:${{ steps.version.outputs.SEMVER }}"
          echo "SHA tag:   ${{ env.API_IMAGE }}:sha-${{ github.sha }}"
          echo ""
          echo "Pull with:"
          echo "  docker pull ${{ env.API_IMAGE }}:latest"
