# ============================================================
# nginx.conf — SmartOmniSentinel reverse proxy
# Routes /api/* and /ws/* to FastAPI backend
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Security headers (applied to all responses)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self'; frame-ancestors 'none';" always;
    # NOTE: Strict-Transport-Security is commented out until HTTPS is enabled.
    # Enabling HSTS on plain HTTP will break the browser — uncomment only after TLS.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    # auth_limit  : strict — 10 req/min for login endpoints (brute-force protection)
    # api_limit   : normal — 60 req/min for all other API calls
    # ws_limit    : connection limit — 5 WS upgrades/min per IP (prevents socket exhaustion)
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m   rate=5r/m;

    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50m;  # Allow video upload

        # ── Auth endpoints — strictest rate limit ────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }

        # ── Evidence clips — stream with extended timeout ────────────────────
        location /api/v1/evidence/clips/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;           # Don't buffer video files
            proxy_read_timeout 300s;       # Allow time for large clip downloads
            proxy_send_timeout 300s;
        }

        # ── WebSocket — rate-limited + long-lived connections ────────────────
        # ws_limit: max 5 new WS connections per minute per IP.
        # burst=3 allows a small burst for dashboard reconnects.
        # This prevents an attacker from opening thousands of sockets
        # and exhausting server memory/file descriptors.
        location /api/v1/ws/ {
            limit_req zone=ws_limit burst=3 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;     # Keep WS alive up to 24h
            proxy_send_timeout 86400s;
        }

        # ── All other API endpoints ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # ── Dashboard static files ───────────────────────────────────────────
        # To serve the dashboard from nginx, replace the return 404 with:
        #   root /usr/share/nginx/html;
        #   try_files $uri $uri/ /index.html;
        # and add a COPY of dashboard/ in the nginx Dockerfile or a volume mount.
        location / {
            return 404 "Dashboard not configured in this deployment.";
        }

        # ── Health probe — no rate limit, no auth ────────────────────────────
        location /api/v1/health/ping {
            proxy_pass http://api_backend;
            access_log off;
        }
    }
}
