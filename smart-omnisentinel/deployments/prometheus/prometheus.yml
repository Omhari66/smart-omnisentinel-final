# ============================================================
# deployments/prometheus/prometheus.yml
# Prometheus scrape configuration for SmartOmniSentinel
# ============================================================

global:
  scrape_interval: 15s       # Scrape every 15 seconds
  evaluation_interval: 15s   # Evaluate alert rules every 15 seconds
  scrape_timeout: 10s

scrape_configs:

  # ── FastAPI application metrics ─────────────────────────────────────────────
  # Scrapes /metrics from the API container.
  # The API container is reachable as 'api:8000' on the Docker internal network.
  # nginx restricts /metrics to internal Docker IPs — Prometheus is inside that
  # network so it accesses the API directly (no TLS needed on internal network).
  - job_name: "smartomnisentinel_api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "api"
          env: "production"

  # ── Prometheus self-monitoring ──────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
