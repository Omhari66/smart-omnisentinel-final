[tool.poetry]
name = "smart-omnisentinel"
version = "1.0.0"
description = "Edge AI-Based Real-Time Incident Detection and Response for CCTV Networks"
authors = ["SmartOmniSentinel Team"]
readme = "README.md"
packages = [
    { include = "api" },
    { include = "core" },
    { include = "db" },
    { include = "services" },
    { include = "ml" },
]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.111.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
websockets = "^12.0"
python-multipart = "^0.0.9"

# Database
sqlalchemy = { version = "^2.0.30", extras = ["asyncio"] }
asyncpg = "^0.29.0"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"

# Cache / queue
redis = { version = "^5.0.4", extras = ["hiredis"] }

# Auth & security
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
python-dotenv = "^1.0.1"
pydantic-settings = "^2.3.1"

# CV / ML
opencv-python-headless = "^4.10.0"
torch = "^2.3.0"
torchvision = "^0.18.0"
ultralytics = "^8.2.0"       # YOLOv8 (detection + pose)
numpy = "^1.26.4"
scipy = "^1.13.0"
onnx = "^1.16.0"
onnxruntime = "^1.18.0"      # CPU inference; swap for onnxruntime-gpu on CUDA hosts

# Notifications
aiosmtplib = "^3.0.1"
httpx = "^0.27.0"             # async HTTP for webhooks

# Utilities
structlog = "^24.2.0"
pydantic = "^2.7.3"
python-dateutil = "^2.9.0"
aiofiles = "^23.2.1"
pillow = "^10.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"             # TestClient
factory-boy = "^3.3.0"
faker = "^25.3.0"
ruff = "^0.4.8"
mypy = "^1.10.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
