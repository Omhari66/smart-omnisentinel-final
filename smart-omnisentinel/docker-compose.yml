
# ============================================================
# SmartOmniSentinel — Docker Compose (Full Stack)
# Usage:
#   cp .env.example .env && nano .env
#   docker compose up -d
# ============================================================

x-common-env: &common-env
  env_file: .env
  environment:
    DB__URL: postgresql+asyncpg://sentinel:${POSTGRES_PASSWORD:-sentinel_dev}@postgres:5432/sentinel
    REDIS__URL: redis://redis:6379/0
    REDIS__ENABLED: "false"   # Set "true" to enable Redis-backed event bus

services:

  # ---- Infrastructure -------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Application ----------------------------------------------------------

  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.api
    <<: *common-env
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - evidence_storage:/app/evidence_storage
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running DB migrations...' &&
        alembic upgrade head &&
        echo 'Starting API...' &&
        uvicorn api.main:app --host 0.0.0.0 --port 8000 --loop uvloop
      "

  inference_worker:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.inference
    <<: *common-env
    restart: unless-stopped
    environment:
      DB__URL: postgresql+asyncpg://sentinel:${POSTGRES_PASSWORD:-sentinel_dev}@postgres:5432/sentinel
      INFERENCE__DEVICE: cpu   # Override: cuda
    volumes:
      - evidence_storage:/app/evidence_storage
      - ./ml/checkpoints:/app/ml/checkpoints:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Uncomment to enable GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ---- Nginx (reverse proxy + static serving) -------------------------------

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  evidence_storage:

networks:
  default:
    name: sentinel_net
