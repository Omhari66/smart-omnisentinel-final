
# ============================================================
# SmartOmniSentinel — Docker Compose (Full Stack)
# Usage:
#   cp .env.example .env && nano .env
#   docker compose up -d
# ============================================================

x-common-env: &common-env
  env_file: .env
  environment:
    DB__URL: postgresql+asyncpg://sentinel:${POSTGRES_PASSWORD:-sentinel_dev}@postgres:5432/sentinel
    REDIS__URL: redis://redis:6379/0
    REDIS__ENABLED: "true"   # Must be true in production for cross-container event bus

services:

  # ---- Infrastructure -------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Application ----------------------------------------------------------

  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.api
    <<: *common-env
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - evidence_storage:/app/evidence_storage
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running DB migrations...' &&
        alembic upgrade head &&
        echo 'Starting API...' &&
        uvicorn api.main:app --host 0.0.0.0 --port 8000 --loop uvloop
      "

  inference_worker:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.inference
    <<: *common-env
    restart: unless-stopped
    environment:
      DB__URL: postgresql+asyncpg://sentinel:${POSTGRES_PASSWORD:-sentinel_dev}@postgres:5432/sentinel
      INFERENCE__DEVICE: cpu   # Override: cuda
    volumes:
      - evidence_storage:/app/evidence_storage
      - ./ml/checkpoints:/app/ml/checkpoints:ro
      # Model weights must be placed in ml/checkpoints/ before first run:
      # cp yolov8n.pt ml/checkpoints/yolov8n.pt
      # cp yolov8n-pose.pt ml/checkpoints/yolov8n-pose.pt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Uncomment to enable GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ---- Nginx (reverse proxy + static serving) -------------------------------

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/nginx/certs:/etc/nginx/certs:ro    # TLS certs (self-signed or Let's Encrypt)
    depends_on:
      - api

  # ---- Prometheus (metrics scraper) ----------------------------------------
  # Scrapes /metrics from the API every 15s.
  # Access Prometheus UI: http://localhost:9090  (dev only — not exposed in prod)

  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"   # Keep 15 days of metrics
      - "--web.enable-lifecycle"               # Allow hot-reload via POST /-/reload
    ports:
      - "9090:9090"   # Dev only — remove in production or restrict via firewall
    depends_on:
      - api

  # ---- Grafana (metrics dashboards) ----------------------------------------
  # Pre-configured to use Prometheus as a data source.
  # Access Grafana UI: http://localhost:3001  (admin / admin on first login)

  grafana:
    image: grafana/grafana:10.4.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"          # Change in production!
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"      # Disable Grafana telemetry
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:3001"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"   # Dev only — restrict in production
    depends_on:
      - prometheus

volumes:
  postgres_data:
  evidence_storage:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: sentinel_net
