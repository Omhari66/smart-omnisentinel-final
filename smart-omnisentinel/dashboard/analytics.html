<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartOmniSentinel | Analytics Dashboard</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-panel: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-base); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); z-index: 10; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent), #8b5cf6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 18px; }
        .logo-text { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
        .header-status { display: flex; align-items: center; gap: 16px; font-size: 14px; color: var(--text-secondary); }
        
        /* MAIN LAYOUT */
        .main-container { display: flex; flex: 1; overflow: hidden; }

        /* SIDEBAR (Match Index) */
        .sidebar { width: 320px; background-color: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar-header { padding: 16px; font-size: 14px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .nav-links { display: flex; flex-direction: column; gap: 8px; padding: 16px; }
        .nav-item { padding: 12px 16px; border-radius: 6px; color: var(--text-secondary); text-decoration: none; font-weight: 500; transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover { background-color: rgba(255,255,255,0.05); color: var(--text-main); }
        .nav-item.active { background-color: rgba(59, 130, 246, 0.15); color: var(--accent); border-left: 3px solid var(--accent); }

        /* ANALYTICS CONTENT */
        .content-area { flex: 1; padding: 32px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
        .page-title { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        
        /* STATS CARDS */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .stat-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .stat-title { font-size: 13px; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }
        .stat-value { font-size: 32px; font-weight: 700; color: var(--text-main); }
        
        /* CHARTS */
        .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; flex: 1; min-height: 400px; }
        .chart-box { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
        .chart-box h3 { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 20px; }
        .canvas-wrapper { flex: 1; position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">S</div>
            <div class="logo-text">SmartOmniSentinel <span style="font-weight: 400; color: var(--text-secondary);">| Analytics</span></div>
        </div>
        <div class="header-status">
            <div id="clock">00:00:00</div>
        </div>
    </header>

    <div class="main-container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">Navigation</div>
            <div class="nav-links">
                <a href="index.html" class="nav-item">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Live Dashboard
                </a>
                <a href="analytics.html" class="nav-item active">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    Analytics & Reporting
                </a>
            </div>
            
            <div class="sidebar-header" style="margin-top: auto;">System Status</div>
            <div style="padding: 16px; font-size: 13px; color: var(--text-secondary);">
                <div>API: <span style="color: var(--success); font-weight: bold;">ONLINE</span></div>
                <div style="margin-top: 8px;">Database: <span style="color: var(--success); font-weight: bold;">CONNECTED</span></div>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="content-area">
            <h1 class="page-title">30-Day Incident Overview</h1>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">Total Incidents</div>
                    <div class="stat-value" id="stat-total">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">High Severity Alerts</div>
                    <div class="stat-value" id="stat-high" style="color: var(--danger);">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">False Positive Rate</div>
                    <div class="stat-value" id="stat-fpr">--%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Unresolved Reviews</div>
                    <div class="stat-value" id="stat-unresolved" style="color: var(--warning);">--</div>
                </div>
            </div>

            <div class="charts-container">
                <div class="chart-box">
                    <h3>Incident Types Breakdown</h3>
                    <div class="canvas-wrapper">
                        <canvas id="typeChart"></canvas>
                    </div>
                </div>
                <div class="chart-box">
                    <h3>Severity Distribution</h3>
                    <div class="canvas-wrapper">
                        <canvas id="severityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        let authToken = null;
        
        // Clock
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', { hour12: false }); }, 1000);

        // Chart instances
        let typeChartInst = null;
        let sevChartInst = null;

        // Dark Theme Chart Defaults
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#334155';

        async function init() {
            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'admin@demo.com', password: 'Admin123!' })
                });
                if (!res.ok) throw new Error('API disconnected');
                const data = await res.json();
                authToken = data.access_token;
                
                await fetchAnalytics();
            } catch (err) {
                console.error('Failed to load analytics', err);
            }
        }

        async function fetchAnalytics() {
            try {
                const res = await fetch(`${API_URL}/incidents/analytics/summary`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();
                
                // Update Top Stats
                document.getElementById('stat-total').innerText = data.total;
                document.getElementById('stat-high').innerText = data.by_severity['HIGH'] || 0;
                document.getElementById('stat-fpr').innerText = (data.false_positive_rate * 100).toFixed(1) + '%';
                
                const unresolved = (data.by_status['PENDING_REVIEW'] || 0) + (data.by_status['ACTIVE_REVIEW'] || 0) + (data.by_status['EMERGENCY'] || 0);
                document.getElementById('stat-unresolved').innerText = unresolved;

                // Render Charts
                renderCharts(data);

            } catch (err) {
                console.error(err);
            }
        }

        function renderCharts(data) {
            // Type Bar Chart
            const typeCtx = document.getElementById('typeChart').getContext('2d');
            if (typeChartInst) typeChartInst.destroy();
            
            const typeLabels = Object.keys(data.by_event_type).map(l => l.replace('_', ' '));
            const typeValues = Object.values(data.by_event_type);
            
            typeChartInst = new Chart(typeCtx, {
                type: 'bar',
                data: {
                    labels: typeLabels,
                    datasets: [{
                        label: 'Incidents',
                        data: typeValues,
                        backgroundColor: 'rgba(59, 130, 246, 0.8)',
                        borderColor: '#3b82f6',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });

            // Severity Pie Chart
            const sevCtx = document.getElementById('severityChart').getContext('2d');
            if (sevChartInst) sevChartInst.destroy();
            
            sevChartInst = new Chart(sevCtx, {
                type: 'doughnut',
                data: {
                    labels: ['HIGH', 'MEDIUM', 'LOW'],
                    datasets: [{
                        data: [
                            data.by_severity['HIGH'] || 0,
                            data.by_severity['MEDIUM'] || 0,
                            data.by_severity['LOW'] || 0
                        ],
                        backgroundColor: [
                            '#ef4444', // Danger
                            '#f59e0b', // Warning
                            '#3b82f6'  // Info
                        ],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 20 } }
                    }
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
